name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check data formatting
        run: |
          npm run check:data || {
            echo "::error title=src/lib/data.ts formatting::Run 'npm run format:data', commit the updated file and push again."
            exit 1
          }

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
